modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "爱憎分明 - Love & Loathing"
    credits = "${mod_credits}"
    authors = "${mod_authors}"
    description = '''一个可以管教自己女仆的mod'''

# gradle.properties 不支持中文

[[dependencies."${mod_id}"]]
    modId = "neoforge"
    type = "required"
    # NeoForge runtime compatibility boundary comes from gradle.properties.
    # Keep it aligned with the compile-time neo_version whenever event APIs change.
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "touhou_little_maid"
    type = "required"
    versionRange = "[2.0.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "mixins.callresponse.json"
