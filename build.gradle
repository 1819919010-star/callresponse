plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'

    // NeoForge 开发插件
    id 'net.neoforged.moddev' version '2.0.95'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

repositories {
    mavenCentral()
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
        content {
            includeGroup "vazkii.patchouli"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
            def tlmJar = project.provider {
                configurations.compileClasspath.find { it.name.contains('touhou-little-maid') }.absolutePath
            }
            programArguments.set([
                    '--all', '--mod', mod_id,
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing', file('src/generated/resources/').getAbsolutePath()
            ])
            programArguments.add('--existing')
            programArguments.add(tlmJar)
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Touhou Little Maid 1.21.1 NeoForge
    implementation "maven.modrinth:touhou-little-maid:1.5.3-neoforge+mc1.21.1"
    // Jade
    implementation "maven.modrinth:jade:${project.jade_version}"
    // Patchouli 游戏内手册（1.21.1 NeoForge，可选运行依赖）
    runtimeOnly "vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}-NEOFORGE"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.resources.srcDir 'src/generated/resources'
neoForge.ideSyncTask generateModMetadata

jar {
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.compileJava {
    // Force recompilation to ensure clean class files
    outputs.upToDateWhen { false }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
