plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'

    // NeoForge 开发插件
    id 'net.neoforged.moddev' version '2.0.141'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

repositories {
    maven {
        url = uri("D:/tlm-m2")
    }
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            clientData()
            def tlmJar = project.provider {
                def dependency = configurations.compileClasspath.find {
                    it.name.contains('touhou-little-maid') || it.name.contains('touhoulittlemaid')
                }
                if (dependency == null) {
                    throw new GradleException('Touhou Little Maid dependency was not found on compileClasspath')
                }
                dependency.absolutePath
            }
            programArguments.set([
                    '--all', '--mod', mod_id,
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing', file('src/generated/resources/').getAbsolutePath()
            ])
            programArguments.add('--existing')
            programArguments.add(tlmJar)
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Touhou Little Maid 26.1 NeoForge
    implementation "com.github.tartaricacid:touhoulittlemaid:${project.tlm_version}"
    // Jade
    implementation "maven.modrinth:jade:${project.jade_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.resources.srcDir 'src/generated/resources'
neoForge.ideSyncTask generateModMetadata

jar {
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.compileJava {
    // Force recompilation to ensure clean class files
    outputs.upToDateWhen { false }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
