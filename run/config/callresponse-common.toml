
#女仆广播回应配置
[broadcast]
	#是否开启调试信息输出到聊天栏
	debugEnabled = false
	#触发广播的前缀，例如输入 '#全体 去干活' 触发
	triggerPrefix = "#全体 "
	#每个女仆的基础回应概率 (0.0-1.0)
	#Range: 0.0 ~ 1.0
	baseChance = 0.4
	#搜索周围女仆的半径（格数）
	#Range: 1 ~ 64
	searchRadius = 16
	#当消息中提到女仆名字时，概率增加的量
	#Range: 0.0 ~ 1.0
	nameMentionBonus = 0.5
	#最多同时回应的女仆数量（防止API调用过多）
	#Range: 1 ~ 20
	maxResponders = 5
	#《呼应》每分钟最多发起多少次 AI 请求；0 表示不限额。只限制广播、主动对话和女仆谈话，不影响 TLM 本体普通聊天
	#Range: 0 ~ 300
	apiCallsPerMinute = 20
	#主人伤害保护破除的总开关；关闭后等级配置无效并完全走正常 TLM/模组伤害逻辑
	ownerDamageBypassEnabled = true
	#主人攻击自己女仆时的保护破除等级：NONE=关闭，BASIC=仅保证进入正常受伤流程，ULTIMATE=沿用原有全破效果
	#Allowed Values: NONE, BASIC, ULTIMATE
	ownerDamageProtectionBreakLevel = "ULTIMATE"

#女仆谈话事件配置
[talk_event]
	#是否启用女仆自动聚集谈话事件。关闭后不会自动触发，也不能用指令强制开启
	enabled = true
	#同一主人在同一区块内至少需要多少只符合条件的女仆才会开始谈话（范围 2~10）
	#Range: 2 ~ 10
	minMaids = 5
	#谈话中一名女仆说完后，下一名女仆最少等待多少秒再回话（范围 1~20 秒）
	#Range: 1 ~ 20
	replyIntervalSeconds = 1

#NPC 日常事件配置
[npc_event]
	#是否允许 NPC 事件沿用各自现有的 AI/固定回复混合逻辑；关闭后所有事件选项都只使用内置固定台词
	enableNpcEventAiReply = true

#背叛女仆配置
[betrayal]
	#背叛女仆死亡爆炸是否破坏地形
	betrayalMaidExplosionBreakBlocks = true

