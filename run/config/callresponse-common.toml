
#女仆广播回应配置
[broadcast]
	#是否开启调试信息输出到聊天栏
	debugEnabled = false
	#触发广播的前缀，例如输入 '#全体 去干活' 触发
	triggerPrefix = "#全体 "
	#每个女仆的基础回应概率 (0.0-1.0)
	#Range: 0.0 ~ 1.0
	baseChance = 0.4
	#搜索周围女仆的半径（格数）
	#Range: 1 ~ 64
	searchRadius = 16
	#当消息中提到女仆名字时，概率增加的量
	#Range: 0.0 ~ 1.0
	nameMentionBonus = 0.5
	#最多同时回应的女仆数量（防止API调用过多）
	#Range: 1 ~ 20
	maxResponders = 5

